version: '3.8'

services:
  aegis-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: aegis-ai:latest
    container_name: aegis-ai
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - AEGIS_HOST=0.0.0.0
      - AEGIS_PORT=5000
      - AEGIS_DEBUG=false
      - AEGIS_RATE_LIMIT=120
      # LLM provider — set AEGIS_LLM_PROVIDER on the host to enable AI features
      # Default is 'none': heuristics only, no API calls.
      - AEGIS_LLM_PROVIDER=${AEGIS_LLM_PROVIDER:-none}
      - AEGIS_LLM_BASE_URL=${AEGIS_LLM_BASE_URL:-}
      - AEGIS_LLM_API_KEY=${AEGIS_LLM_API_KEY:-}
      - AEGIS_LLM_MODEL=${AEGIS_LLM_MODEL:-}
      - AEGIS_LLM_MODEL_LARGE=${AEGIS_LLM_MODEL_LARGE:-}
      # Legacy provider pass-throughs (kept for compatibility)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Amazon Bedrock (optional — only used when AEGIS_LLM_PROVIDER=bedrock)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - OLLAMA_HOST=${OLLAMA_HOST:-}
    volumes:
      - ./data:/app/data
      - ./targets.allowlist:/app/targets.allowlist:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/report"]
      interval: 30s
      timeout: 5s
      retries: 3
