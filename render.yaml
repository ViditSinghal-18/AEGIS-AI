services:
  - type: web
    name: aegis-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0
      - key: AEGIS_HOST
        value: 0.0.0.0
      - key: AEGIS_DISABLE_ACTIVE_SCAN
        value: "true"
      - key: AEGIS_PUBLIC_ENV
        value: "true"
      - key: AEGIS_LLM_PROVIDER
        value: openai_compatible
      - key: AEGIS_LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: AEGIS_LLM_ENDPOINT
        value: https://api.groq.com/openai/v1
      - key: AEGIS_LLM_API_KEY
        sync: false
