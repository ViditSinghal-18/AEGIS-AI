name: AEGIS-AI CI / CD Pipeline

on:
  push:
    branches: [ "main", "real-aegis" ]
  pull_request:
    branches: [ "main", "real-aegis" ]

jobs:
  test:
    name: Test & Evaluate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install System Scanner (nmap)
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends nmap

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pip-audit pytest

    - name: Lint & Static Syntax Validation
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,venv

    - name: Run Pytest Test Suite
      run: |
        python -m pytest tests/ -v

    - name: Run OWASP Juice Shop Benchmark & Evaluation
      run: |
        python tests/validate.py

    - name: Dependency Security Audit
      run: |
        pip-audit -r requirements.txt || true

  docker-build:
    name: Build & Validate Docker Container
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Container Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: aegis-ai:test
