<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="aegisShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="aegisCoreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="aegisInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="aegisGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Aegis Defensive Armor Shell -->
  <path d="M32 4 L56 14 V32 C56 46 45 56 32 60 C19 56 8 46 8 32 V14 Z" fill="#090f1d" stroke="url(#aegisShieldGrad)" stroke-width="2.5" filter="url(#aegisGlow)"/>
  <!-- Cyber Circuit Inlay Shield -->
  <path d="M32 11 L48 18 V30 C48 40.5 40 48.5 32 52 C24 48.5 16 40.5 16 30 V18 Z" fill="url(#aegisCoreGrad)" fill-opacity="0.3" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.75"/>
  <!-- High-Tech Circuit Traces -->
  <line x1="32" y1="12" x2="32" y2="20" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="22" x2="26" y2="26" stroke="#00f0ff" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="44" y1="22" x2="38" y2="26" stroke="#00f0ff" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="32" y2="50" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Central Autonomous AI Core Star -->
  <polygon points="32,20 35.5,28.5 44,32 35.5,35.5 32,44 28.5,35.5 20,32 28.5,28.5" fill="url(#aegisInnerGrad)"/>
  <!-- Radiant Core Eye -->
  <circle cx="32" cy="32" r="3.5" fill="#ffffff" filter="url(#aegisGlow)"/>
  <circle cx="32" cy="32" r="1.8" fill="#00f0ff"/>
  <!-- Perimeter Node Orbs -->
  <circle cx="32" cy="6" r="1.5" fill="#00f0ff"/>
  <circle cx="54" cy="15" r="1.3" fill="#3b82f6"/>
  <circle cx="10" cy="15" r="1.3" fill="#3b82f6"/>
</svg>
